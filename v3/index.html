<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESTAÇÃO ÓRION — Missão Sinalizador</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --hud:#2a1a12; --hud2:#3d281c; --line:#6b4630;
  --amber:#ffb020; --red:#e04b3a; --green:#4fd18b; --steel:#b9c4d0;
  --ink:#f6e7cf;
}
html,body{height:100%}
body{background:#0a0806;color:var(--ink);
  font-family:'Segoe UI',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;user-select:none}

#wrap{width:min(100vw,1180px);display:flex;flex-direction:column;gap:0}

/* ---------- TELA ---------- */
#screen{position:relative;width:100%;aspect-ratio:16/10;
  background:#160d08;border:3px solid var(--line);border-bottom:none;
  border-radius:8px 8px 0 0;overflow:hidden}
canvas{display:block;width:100%;height:100%}

/* ---------- HUD estilo Doom ---------- */
#hud{display:flex;align-items:stretch;gap:2px;
  background:linear-gradient(180deg,var(--hud2),var(--hud));
  border:3px solid var(--line);border-radius:0 0 8px 8px;padding:8px 10px;
  font-family:'Consolas','Courier New',monospace}
.box{background:rgba(0,0,0,.32);border:1px solid rgba(0,0,0,.5);
  border-radius:5px;padding:6px 12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;min-width:0}
.box .lbl{font-size:.6rem;letter-spacing:.18em;color:#b08d6a}
.box .val{font-family:'Impact','Haettenschweiler',sans-serif;
  font-size:1.9rem;line-height:1;letter-spacing:.02em}
#objBox{flex:1;align-items:flex-start;text-align:left}
#objBox .val{font-family:'Segoe UI',system-ui,sans-serif;font-size:.95rem;
  font-weight:600;line-height:1.25;letter-spacing:0;color:var(--ink)}
#face{width:74px;height:74px;flex-shrink:0;display:grid;place-items:center;
  background:#120b07;border:2px solid var(--line);border-radius:5px}
#face img{width:60px;height:60px;image-rendering:auto}
#keys{display:flex;gap:5px}
.key{width:26px;height:26px;border-radius:4px;border:1px solid #000;
  display:grid;place-items:center;font-size:15px;
  background:#1a110b;opacity:.32;filter:grayscale(1)}
.key.on{opacity:1;filter:none;background:#3a2716;
  box-shadow:0 0 8px rgba(255,176,32,.55)}
.amber{color:var(--amber)}.green{color:var(--green)}.red{color:var(--red)}

/* ---------- PAINÉIS ---------- */
#veil{position:absolute;inset:0;background:rgba(8,5,3,.86);
  display:none;align-items:center;justify-content:center;padding:22px;z-index:10}
#veil.on{display:flex}
.panel{width:min(620px,100%);max-height:100%;overflow:auto;
  background:linear-gradient(180deg,#241811,#180f0a);
  border:3px solid var(--line);border-radius:10px;padding:24px 26px;
  box-shadow:0 18px 50px rgba(0,0,0,.7)}
.panel h2{font-family:'Impact','Haettenschweiler',sans-serif;
  font-size:1.7rem;letter-spacing:.04em;color:var(--amber);margin-bottom:4px}
.panel .sub{font-size:.68rem;letter-spacing:.22em;color:#9c7c5d;
  text-transform:uppercase;margin-bottom:14px;font-family:'Consolas',monospace}
.panel p{font-size:1rem;line-height:1.65;color:#e3d3ba}
.panel p+p{margin-top:10px}
.panel .pickup{display:flex;gap:16px;align-items:center;margin:14px 0}
.panel .pickup .ico{font-size:2.6rem}
.btn{margin-top:18px;padding:11px 26px;border:2px solid var(--amber);
  border-radius:6px;background:rgba(255,176,32,.14);color:var(--amber);
  font-family:'Consolas',monospace;font-size:.95rem;font-weight:700;
  letter-spacing:.1em;cursor:pointer;text-transform:uppercase}
.btn:hover{background:var(--amber);color:#1a1008}
.btn.ghost{border-color:#6b4630;color:#b08d6a;background:transparent}
.btn.ghost:hover{background:#3d281c;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* montagem */
.slots{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.slot{min-height:44px;border:2px dashed #6b4630;border-radius:6px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Consolas',monospace;font-size:.9rem;color:#9c7c5d;
  cursor:pointer;padding:6px 12px}
.slot.fill{border-style:solid;color:var(--ink);background:rgba(255,255,255,.05)}
.slot.ok{border-color:var(--green);background:rgba(79,209,139,.13);color:#dff5e9}
.slot.bad{border-color:var(--red);background:rgba(224,75,58,.13)}
.fixed{min-height:38px;border:2px solid var(--line);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Consolas',monospace;font-size:.85rem;color:var(--steel);
  background:rgba(185,196,208,.08)}
.arrow{text-align:center;color:#6b4630;font-size:.8rem}
.tray{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.piece{padding:8px 14px;border:1px solid var(--line);border-radius:6px;
  background:#231710;color:var(--ink);font-family:'Consolas',monospace;
  font-size:.85rem;cursor:pointer}
.piece:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
.piece:disabled{opacity:.3;cursor:not-allowed}
.msg{margin-top:12px;padding:10px 14px;border-radius:6px;font-size:.9rem;
  border-left:3px solid var(--amber);background:rgba(255,176,32,.1)}
.msg.err{border-left-color:var(--red);background:rgba(224,75,58,.12)}
.msg.win{border-left-color:var(--green);background:rgba(79,209,139,.12)}
pre{background:#0d0806;border:1px solid var(--line);border-radius:6px;
  padding:14px;margin-top:14px;font-family:'Consolas',monospace;font-size:.82rem;
  line-height:1.7;color:#cfe3ff;overflow-x:auto}
.k{color:#ff9ec4}.f{color:#8fd8ff}.n{color:#b8f7c8}.c{color:#6b6394;font-style:italic}

#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  background:rgba(10,6,4,.82);border:1px solid var(--line);border-radius:20px;
  padding:6px 18px;font-family:'Consolas',monospace;font-size:.8rem;
  color:var(--amber);display:none;z-index:5;white-space:nowrap}
#hint.on{display:block}

#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);
  background:rgba(10,6,4,.9);border:1px solid var(--green);border-radius:6px;
  padding:8px 20px;font-family:'Consolas',monospace;font-size:.9rem;
  color:var(--green);opacity:0;transition:opacity .3s;z-index:6;white-space:nowrap}
#toast.on{opacity:1}

@media(max-width:820px){
  .box .val{font-size:1.3rem}
  #face{width:54px;height:54px}#face img{width:44px;height:44px}
  #objBox .val{font-size:.8rem}
  .key{width:20px;height:20px;font-size:12px}
}
</style>
</head>
<body>

<div id="wrap">
  <div id="screen">
    <canvas id="cv" width="1120" height="700"></canvas>
    <div id="hint"></div>
    <div id="toast"></div>
    <div id="veil"><div class="panel" id="panel"></div></div>
  </div>

  <div id="hud">
    <div class="box"><span class="lbl">PEÇAS</span><span class="val amber" id="hPecas">0/4</span></div>
    <div class="box" id="objBox"><span class="lbl">OBJETIVO</span><span class="val" id="hObj">—</span></div>
    <div id="face"><img id="hFace" alt="engenheira"></div>
    <div class="box"><span class="lbl">INVENTÁRIO</span>
      <div id="keys">
        <span class="key" data-k="led">💡</span>
        <span class="key" data-k="resistor">🧱</span>
        <span class="key" data-k="jumpers">🔌</span>
        <span class="key" data-k="protoboard">🍞</span>
      </div>
    </div>
    <div class="box"><span class="lbl">CIRCUITO</span><span class="val red" id="hCirc">OFF</span></div>
  </div>
</div>

  '2': { id:'resistor', nome:'RESISTOR 220Ω', ico:'🧱', sprite:'stRes',
    txt:['Funciona como uma lombada para a corrente: deixa passar, mas em quantidade controlada.',
         'Sem ele, o LED recebe corrente demais e <b>queima</b>. É barato e salva a peça.'] },
  '3': { id:'jumpers', nome:'JUMPERS', ico:'🔌', sprite:'stJmp',
    txt:['Os fios que ligam uma coisa na outra. São as pontes do circuito.',
         'Um vai levar a corrente do pino até a peça; o outro vai trazê-la <b>de volta</b> para a placa.'] },
  '4': { id:'protoboard', nome:'PROTOBOARD', ico:'🍞', sprite:'stPro',
    txt:['A bancada furadinha onde tudo se encaixa <b>sem solda</b>.',
         'Cada coluna de furos é ligada por dentro — é assim que duas peças se conectam sem fio nenhum.'] },
};

/* ---------- estado ---------- */
const jogo = {
  temos: {},        // peças coletadas
  montado: false,   // circuito montado
  venceu: false,
  pausado: false,
};
const totalPecas = 4;
const nPecas = () => Object.keys(jogo.temos).length;

/* ---------- jogador ---------- */
const spawn = acharTile('P');
const p = { x: spawn.x, y: spawn.y, vx:0, vy:0, ang:0, andando:false, passo:0 };

function acharTile(ch) {
  for (let r = 0; r < ROWS; r++) {
    const c = MAPA[r].indexOf(ch);
    if (c !== -1) return { x: c * TILE + TILE/2, y: r * TILE + TILE/2, c, r };
  }
  return { x: TILE*1.5, y: TILE*1.5, c:1, r:1 };
}
function todosTiles(ch) {
  const out = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (MAPA[r][c] === ch) out.push({ x:c*TILE+TILE/2, y:r*TILE+TILE/2, c, r });
  return out;
}

/* ---------- entrada ---------- */
const teclas = {};
const MOV = {
  KeyW:'cima', ArrowUp:'cima', KeyS:'baixo', ArrowDown:'baixo',
  KeyA:'esq', ArrowLeft:'esq', KeyD:'dir', ArrowRight:'dir',
};
addEventListener('keydown', (e) => {
  if (MOV[e.code]) { teclas[MOV[e.code]] = true; e.preventDefault(); }
  if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (jogo.pausado) fecharPainel(); else interagir();
  }
  if (e.code === 'Escape' && jogo.pausado) fecharPainel();
});
addEventListener('keyup', (e) => { if (MOV[e.code]) { teclas[MOV[e.code]] = false; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in teclas) teclas[k] = false; });

/* ---------- colisão ---------- */
const RAIO = 20;
function livre(x, y) {
  for (const [dx, dy] of [[-RAIO,-RAIO],[RAIO,-RAIO],[-RAIO,RAIO],[RAIO,RAIO]]) {
    if (solido(Math.floor((x+dx)/TILE), Math.floor((y+dy)/TILE))) return false;
  }
  return true;
}

/* ---------- interação ---------- */
const ALCANCE = 82;
function alvoPerto() {
  let melhor = null, dist = ALCANCE;
  const cands = [];
  for (const ch of ['1','2','3','4']) {
    if (!jogo.temos[PECAS[ch].id]) todosTiles(ch).forEach(t => cands.push({ tipo:'peca', ch, ...t }));
  }
  todosTiles('A').forEach(t => cands.push({ tipo:'bancada', ...t }));
  todosTiles('S').forEach(t => cands.push({ tipo:'sinal', ...t }));
  for (const t of cands) {
    const d = Math.hypot(t.x - p.x, t.y - p.y);
    if (d < dist) { dist = d; melhor = t; }
  }
  return melhor;
}

function interagir() {
  const alvo = alvoPerto();
  if (!alvo) return;
  if (alvo.tipo === 'peca') return pegarPeca(alvo.ch);
  if (alvo.tipo === 'bancada') return abrirBancada();
  if (alvo.tipo === 'sinal') return abrirSinal();
}

/* ═══ PAINÉIS ═══ */
const veil = document.getElementById('veil');
const painel = document.getElementById('panel');
function abrirPainel(html) { painel.innerHTML = html; veil.classList.add('on'); jogo.pausado = true; }
function fecharPainel() { veil.classList.remove('on'); jogo.pausado = false; for (const k in teclas) teclas[k] = false; }
veil.addEventListener('click', (e) => { if (e.target === veil) fecharPainel(); });

function pegarPeca(ch) {
  const pc = PECAS[ch];
  jogo.temos[pc.id] = true;
  atualizarHud();
  toast('+ ' + pc.nome);
  abrirPainel(`
    <h2>${pc.nome}</h2>
    <div class="sub">peça ${nPecas()} de ${totalPecas} — recolhida</div>
    <div class="pickup"><span class="ico">${pc.ico}</span><div>${pc.txt.map(t=>`<p>${t}</p>`).join('')}</div></div>
    <button class="btn" onclick="fecharPainel()">Continuar &nbsp;[E]</button>
  `);
}

function abrirBancada() {
  if (jogo.montado) {
    return abrirPainel(`<h2>BANCADA</h2><div class="sub">circuito montado</div>
      <p>O circuito já está montado. Vá até a <b>torre do sinalizador</b> e ligue o sistema.</p>
      <button class="btn" onclick="fecharPainel()">Fechar &nbsp;[E]</button>`);
  }
  if (nPecas() < totalPecas) {
    const faltam = Object.values(PECAS).filter(x => !jogo.temos[x.id]).map(x => x.nome).join(', ');
    return abrirPainel(`<h2>BANCADA</h2><div class="sub">faltam peças</div>
      <p>Não dá para montar o circuito sem tudo em mãos.</p>
      <p>Ainda falta: <b>${faltam}</b>.</p>
      <button class="btn" onclick="fecharPainel()">Fechar &nbsp;[E]</button>`);
  }
  montagem();
}

/* --- minijogo de montagem --- */
const ESPERADO = ['pino13','resistor','led','gnd'];
const OPCOES = [
  { id:'pino13', rot:'Pino 13 (saída digital)' },
  { id:'resistor', rot:'Resistor 220Ω' },
  { id:'led', rot:'LED' },
  { id:'gnd', rot:'GND' },
  { id:'v5', rot:'5V' },
  { id:'botao', rot:'Botão' },
];
let slots = [null, null, null, null];
let ativo = 0;

function montagem(msg) {
  const dicas = ['de onde sai a corrente?','o que protege o LED?','o que emite a luz?','por onde a corrente volta?'];
  const slotHtml = slots.map((s, i) => {
    const op = OPCOES.find(o => o.id === s);
    const cls = 'slot' + (s ? ' fill' : '') + (ativo === i ? '' : '');
    return `<div class="arrow">▼</div><div class="${cls}" data-slot="${i}">${op ? op.rot : '[ ' + dicas[i] + ' ]'}</div>`;
  }).join('');
  abrirPainel(`
    <h2>MONTAR O CIRCUITO</h2>
    <div class="sub">a corrente sai da placa e precisa voltar para ela</div>
    <p>Coloque as peças na ordem em que a corrente passa por elas.</p>
    <div class="slots">
      <div class="fixed">🤖 ARDUINO — saída</div>
      ${slotHtml}
      <div class="arrow">▼</div>
      <div class="fixed">🤖 ARDUINO — retorno</div>
    </div>
    <div class="tray">${OPCOES.map(o =>
      `<button class="piece" data-op="${o.id}" ${slots.includes(o.id)?'disabled':''}>${o.rot}</button>`).join('')}</div>
    ${msg || ''}
    <div class="row">
      <button class="btn" id="btnVerif" ${slots.includes(null)?'disabled':''}>Verificar</button>
      <button class="btn ghost" id="btnLimpar">Limpar</button>
      <button class="btn ghost" onclick="fecharPainel()">Sair</button>
    </div>
  `);
  painel.querySelectorAll('.piece').forEach(b => b.onclick = () => {
    const i = slots.indexOf(null);
    if (i === -1) return;
    slots[i] = b.dataset.op;
    montagem();
  });
  painel.querySelectorAll('.slot').forEach(s => s.onclick = () => {
    slots[+s.dataset.slot] = null; montagem();
  });
  painel.querySelector('#btnLimpar').onclick = () => { slots = [null,null,null,null]; montagem(); };
  painel.querySelector('#btnVerif').onclick = () => {
    const ok = slots.every((s, i) => s === ESPERADO[i]);
    if (!ok) {
      const errados = slots.filter((s,i) => s !== ESPERADO[i]).length;
      return montagem(`<div class="msg err">Ainda não. ${errados} peça(s) fora de lugar.
        Lembre: a corrente <b>sai por um pino</b>, passa pelo que a limita, acende a luz e <b>volta pelo GND</b>.</div>`);
    }
    jogo.montado = true;
    atualizarHud();
    toast('CIRCUITO MONTADO');
    abrirPainel(`<h2>CIRCUITO MONTADO</h2><div class="sub">caminho fechado</div>
      <p>A corrente sai pelo <b>pino 13</b>, é limitada pelo <b>resistor</b>, acende o <b>LED</b>
      e volta pelo <b>GND</b>. Um caminho fechado — é isso que faz qualquer circuito funcionar.</p>
      <p>Agora vá até a <b>torre do sinalizador</b> e envie o programa.</p>
      <button class="btn" onclick="fecharPainel()">Continuar &nbsp;[E]</button>`);
  };
}

function abrirSinal() {
  if (!jogo.montado) {
    return abrirPainel(`<h2>TORRE DO SINALIZADOR</h2><div class="sub">sem circuito</div>
      <p>A torre não tem o que acender. Monte o circuito na <b>bancada</b> primeiro.</p>
      <button class="btn" onclick="fecharPainel()">Fechar &nbsp;[E]</button>`);
  }
  jogo.venceu = true;
  atualizarHud();
  toast('SINALIZADOR ATIVADO');
  abrirPainel(`
    <h2 class="green" style="color:var(--green)">SINALIZADOR ATIVADO</h2>
    <div class="sub">estação órion — sistema de emergência online</div>
    <p>O LED está piscando: 1 segundo aceso, 1 segundo apagado. Este é o programa que faz isso:</p>
    <pre><span class="c">// o pino onde o LED está ligado</span>
<span class="k">int</span> led = <span class="n">13</span>;

<span class="k">void</span> <span class="f">setup</span>() {
  <span class="f">pinMode</span>(led, OUTPUT);   <span class="c">// pino como SAÍDA</span>
}

<span class="k">void</span> <span class="f">loop</span>() {
  <span class="f">digitalWrite</span>(led, HIGH); <span class="c">// liga</span>
  <span class="f">delay</span>(<span class="n">1000</span>);            <span class="c">// espera 1s</span>
  <span class="f">digitalWrite</span>(led, LOW);  <span class="c">// desliga</span>
  <span class="f">delay</span>(<span class="n">1000</span>);            <span class="c">// espera 1s</span>
}</pre>
    <div class="msg win">Agora é de verdade: monte esse circuito na protoboard e envie esse código
    para o seu Arduino pela Arduino IDE.</div>
    <div class="row">
      <button class="btn" onclick="fecharPainel()">Voltar ao mapa &nbsp;[E]</button>
      <button class="btn ghost" onclick="location.reload()">Jogar de novo</button>
    </div>`);
}

/* ---------- HUD ---------- */
const hPecas = document.getElementById('hPecas');
const hObj = document.getElementById('hObj');
const hCirc = document.getElementById('hCirc');
function atualizarHud() {
  hPecas.textContent = nPecas() + '/' + totalPecas;
  document.querySelectorAll('.key').forEach(k => k.classList.toggle('on', !!jogo.temos[k.dataset.k]));
  hCirc.textContent = jogo.venceu ? 'ON' : (jogo.montado ? 'PRONTO' : 'OFF');
  hCirc.className = 'val ' + (jogo.venceu ? 'green' : (jogo.montado ? 'amber' : 'red'));
  hObj.textContent =
    jogo.venceu ? 'Missão cumprida. Agora monte de verdade!' :
    jogo.montado ? 'Vá até a torre do sinalizador (direita) e ligue o sistema.' :
    nPecas() < totalPecas ? 'Encontre as ' + totalPecas + ' peças espalhadas pela estação.' :
    'Peças completas! Vá até a bancada no centro e monte o circuito.';
}

const elToast = document.getElementById('toast');
let toastT = null;
function toast(txt) {
  elToast.textContent = txt; elToast.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => elToast.classList.remove('on'), 1800);
}
const elHint = document.getElementById('hint');

/* ---------- imagens ---------- */
const img = {};
let carregadas = 0, totalImgs = Object.keys(ASSETS).length;
for (const k in ASSETS) {
  const i = new Image();
  i.onload = i.onerror = () => { if (++carregadas === totalImgs) comecar(); };
  i.src = ASSETS[k];
  img[k] = i;
}
document.getElementById('hFace').src = ASSETS.player;

/* ---------- desenho ---------- */
const cam = { x:0, y:0 };

/* Ruído estável por tile: o cenário varia mas não "ferve" entre quadros. */
function ruido(c, r) {
  let n = c * 374761393 + r * 668265263;
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967296;
}

/* Parede: o pacote Kenney é de RTS de terreno aberto, não tem tile de
   parede. Então a parede é desenhada como bloco sólido (com topo
   iluminado e base em sombra) e a pedra entra por cima só como textura —
   sozinha, ela parecia uma pedrinha solta em vez de um muro. */
function desenharParede(x, y, c, r) {
  ctx.fillStyle = '#4a2c1e';
  ctx.fillRect(x, y, TILE, TILE);
  const v = ruido(c, r) * 0.07;
  ctx.fillStyle = `rgba(0,0,0,${v.toFixed(3)})`;
  ctx.fillRect(x, y, TILE, TILE);
  if (!solido(c, r - 1)) { ctx.fillStyle = '#7a5138'; ctx.fillRect(x, y, TILE, 9); }
  if (!solido(c, r + 1)) { ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x, y + TILE - 7, TILE, 7); }
  if (!solido(c - 1, r)) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x, y, 5, TILE); }
  if (!solido(c + 1, r)) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x + TILE - 5, y, 5, TILE); }
  ctx.drawImage(img.rock, x + 5, y + 3, TILE - 10, TILE - 10);
}
function desenhar(dt) {
  cam.x = Math.max(0, Math.min(MAPW - W, p.x - W/2));
  cam.y = Math.max(0, Math.min(MAPH - H, p.y - H/2));
  if (MAPW < W) cam.x = (MAPW - W) / 2;
  if (MAPH < H) cam.y = (MAPH - H) / 2;

  ctx.fillStyle = '#160d08';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));

  const c0 = Math.max(0, Math.floor(cam.x / TILE)), c1 = Math.min(COLS-1, Math.ceil((cam.x+W)/TILE));
  const r0 = Math.max(0, Math.floor(cam.y / TILE)), r1 = Math.min(ROWS-1, Math.ceil((cam.y+H)/TILE));

  // chão — a base é lisa, então entram manchas decorativas e variação de
  // luz por tile; sem isso o mapa vira um vazio laranja.
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const ch = MAPA[r][c];
    const x = c*TILE, y = r*TILE;
    ctx.drawImage(ch === ',' ? img.ground2 : img.ground, x, y, TILE, TILE);
    const k = ruido(c, r);
    if (ch === '.' || ch === ',') {
      if (k > 0.90) ctx.drawImage(img.deco1, x, y, TILE, TILE);
      else if (k > 0.78) ctx.drawImage(img.deco2, x, y, TILE, TILE);
    }
    // bem sutil: acima de ~0.05 o olho enxerga o xadrez dos tiles
    ctx.fillStyle = `rgba(0,0,0,${(k * 0.035).toFixed(3)})`;
    ctx.fillRect(x, y, TILE, TILE);
  }
  // objetos
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const ch = MAPA[r][c];
    const x = c*TILE, y = r*TILE;
    if (ch === '#') desenharParede(x, y, c, r);
    else if (ch === 'c') ctx.drawImage(img.crystal, x+10, y+10, TILE-20, TILE-20);
    else if (ch === 'v') ctx.drawImage(img.plant, x+10, y+10, TILE-20, TILE-20);
    else if (PECAS[ch]) {
      if (jogo.temos[PECAS[ch].id]) { ctx.globalAlpha = .5; ctx.drawImage(img[PECAS[ch].sprite], x+12, y+12, TILE-24, TILE-24); ctx.globalAlpha = 1; }
      else desenharAlvo(img[PECAS[ch].sprite], x, y, true);
    }
    else if (ch === 'A') desenharAlvo(img.bench, x, y, nPecas() === totalPecas && !jogo.montado);
    else if (ch === 'S') desenharAlvo(img.tower, x, y, jogo.montado && !jogo.venceu);
  }

  // farol piscando na torre depois de vencer
  if (jogo.venceu) {
    const t = todosTiles('S')[0];
    const on = Math.floor(performance.now() / 1000) % 2 === 0;
    if (on) {
      ctx.save();
      const g = ctx.createRadialGradient(t.x, t.y-24, 4, t.x, t.y-24, 90);
      g.addColorStop(0, 'rgba(255,190,60,.95)'); g.addColorStop(1, 'rgba(255,160,40,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(t.x, t.y-24, 90, 0, 7); ctx.fill();
      ctx.restore();
    }
  }

  // jogador
  ctx.save();
  ctx.translate(p.x, p.y + (p.andando ? -Math.abs(Math.sin(p.passo)) * 4 : 0));
  ctx.rotate(p.ang);
  const s = 70 + (p.andando ? Math.abs(Math.sin(p.passo)) * 4 : 0);
  ctx.globalAlpha = .35;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 24, 20, 7, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.drawImage(img.player, -s/2, -s/2, s, s);
  ctx.restore();

  ctx.restore();

  // escurecimento nas bordas
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.42, W/2, H/2, H*0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function desenharAlvo(sprite, x, y, pulsa) {
  const k = pulsa ? 1 + Math.sin(performance.now()/320) * 0.05 : 1;
  const t = TILE * 1.34 * k;
  if (pulsa) {
    ctx.save();
    const g = ctx.createRadialGradient(x+TILE/2, y+TILE/2, 6, x+TILE/2, y+TILE/2, 62);
    g.addColorStop(0, 'rgba(255,176,32,.34)'); g.addColorStop(1, 'rgba(255,176,32,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x+TILE/2, y+TILE/2, 62, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.drawImage(sprite, x + TILE/2 - t/2, y + TILE/2 - t/2 - 6, t, t);
}

/* ---------- loop ---------- */
const VEL = 205;
let ultimo = 0;
function passo(t) {
  const dt = Math.min(0.05, (t - ultimo) / 1000 || 0);
  ultimo = t;

  if (!jogo.pausado) {
    let dx = (teclas.dir ? 1 : 0) - (teclas.esq ? 1 : 0);
    let dy = (teclas.baixo ? 1 : 0) - (teclas.cima ? 1 : 0);
    if (dx && dy) { const k = Math.SQRT1_2; dx *= k; dy *= k; }
    p.andando = !!(dx || dy);
    if (p.andando) {
      p.ang = Math.atan2(dy, dx) + Math.PI/2;   // sprite aponta para cima
      p.passo += dt * 11;
      const nx = p.x + dx * VEL * dt, ny = p.y + dy * VEL * dt;
      if (livre(nx, p.y)) p.x = nx;
      if (livre(p.x, ny)) p.y = ny;
    }
    const alvo = alvoPerto();
    if (alvo) {
      elHint.classList.add('on');
      elHint.textContent = alvo.tipo === 'peca'
        ? '[E] recolher ' + PECAS[alvo.ch].nome
        : alvo.tipo === 'bancada' ? '[E] usar a bancada' : '[E] ligar o sinalizador';
    } else elHint.classList.remove('on');
  }

  desenhar(dt);
  requestAnimationFrame(passo);
}

function comecar() {
  atualizarHud();
  abrirPainel(`
    <h2>ESTAÇÃO ÓRION</h2>
    <div class="sub">missão: religar o sinalizador</div>
    <p>O sinalizador de emergência está apagado. As peças para consertá-lo
    foram espalhadas pelos setores da estação.</p>
    <p><b>Objetivo:</b> encontre as 4 peças, monte o circuito na bancada do centro
    e ligue a torre do sinalizador.</p>
    <div class="msg"><b>Controles</b> &nbsp;·&nbsp; <b>WASD</b> ou <b>setas</b> para andar
    &nbsp;·&nbsp; <b>E</b> (ou espaço) para interagir</div>
    <button class="btn" onclick="fecharPainel()">Começar &nbsp;[E]</button>
  `);
  requestAnimationFrame(passo);
}
</script>
</body>
</html>
